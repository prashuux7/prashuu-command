<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRASHUU COMMAND</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101522;
  color: white;
  min-height: 100vh;
  display: grid;
  place-items: center;
}
.app {
  width: 85%;
  max-width: 450px;
  background: #1c2638;
  padding: 25px;
  border-radius: 18px;
  text-align: center;
}
h1 { color: #65d6ff; }
input {
  width: 90%;
  padding: 14px;
  border: 0;
  border-radius: 9px;
  margin: 15px 0;
}
button {
  padding: 12px 25px;
  border: 0;
  border-radius: 9px;
  background: #65d6ff;
  font-weight: bold;
}
#result { margin-top: 20px; }
</style>
</head>
<body>
<div class="app">
  <h1>PRASHUU COMMAND</h1>
  <p>Type your command below</p>
  <input id="command" placeholder="Example: Open YouTube">
  <br>
  <button onclick="runCommand()">Execute</button>
  <div id="result">Waiting for command...</div>
</div>

<script>
function runCommand() {
  const cmd = document.getElementById("command").value.trim().toLowerCase();
  const result = document.getElementById("result");

  if (cmd === "open youtube") {
    result.textContent = "Opening YouTube...";
    window.open("https://www.youtube.com", "_blank");
  } else if (cmd === "open google") {
    result.textContent = "Opening Google...";
    window.open("https://www.google.com", "_blank");
  } else {
    result.textContent = "Command not recognized!";
  }
}
</script>
</body>
</html>
